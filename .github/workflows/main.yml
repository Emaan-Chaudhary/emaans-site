name: React Build & Deploy to S3

on:
  push:
    branches:
      - main  # Your main branch

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout code
        uses: actions/checkout@v3

      

      # 5️⃣ Configure AWS credentials
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:  ap-south-east-2

      # 6️⃣ Deploy build folder to S3
      - name: Deploy to S3
        run: aws s3 sync build/ s3://emaan-site --delete 

